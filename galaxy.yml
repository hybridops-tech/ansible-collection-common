---
# purpose: Ansible Galaxy metadata for hybridops.common collection
# adr: ADR-0606-ansible-collections-release-process
# maintainer: HybridOps.Tech

namespace: hybridops
name: common
version: "0.1.8"

readme: README.md
description: >-
  Shared plugins and utility roles for HybridOps.Tech, providing common
  tagging patterns, environment handling, connectivity checks, and governance
  helpers.

authors:
  - HybridOps.Tech

license:
  - Apache-2.0

tags:
  - hybridops
  - automation
  - plugins
  - infrastructure
  - linux
  - governance
  - connectivity
  - proxmox
  - hybrid
  - kubernetes
  - devops
  - platform

homepage: https://hybridops.tech
documentation: https://docs.hybridops.tech
repository: https://github.com/hybridops-tech/ansible-collection-common
issues: https://github.com/hybridops-tech/ansible-collection-common/issues

dependencies: {}

build_ignore:
  - .git
  - .gitignore
  - .github
  - .ansible
  - .config/linters/.ansible
  - .config/linters/.ansible/**
  - .tox
  - .venv
  - "*.tar.gz"
  - build
  - dist
  - output
  - roles/*/.github
  - roles/*/.github/**
  - roles/*/.showcase
  - roles/*/.showcase/**
  - roles/*/tests/output
  - roles/*/tests/output/**
  - roles/*/tests/outputs
  - roles/*/tests/outputs/**
  - tests/output
  - tests/output/**
  - tests/outputs
  - tests/outputs/**
  - __pycache__
  - .mypy_cache
  - .pytest_cache
